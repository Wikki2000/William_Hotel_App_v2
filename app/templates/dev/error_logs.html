<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type="module" defer src="/static/js/dev/error_logs.js"></script>
    <style>
        :root {
            --wiventory-orange: #ff6600;
        }
        .table td, .table th {
            vertical-align: middle;
        }
        .dropdown-toggle::after {
            display: none;
        }
        .bg-wiventory {
            background-color: var(--wiventory-orange);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Error Logs</h3>
            <div class="d-flex gap-2">
                <input type="text" class="form-control" placeholder="Search...">
                <select class="form-select">
                    <option value="">All Status</option>
                    <option value="treated">Treated</option>
                    <option value="untreated">Untreated</option>
                </select>
            </div>
        </div>

        <table class="table table-bordered">
            <thead class="bg-wiventory">
                <tr>
                    <th><input type="checkbox" id="checkAll"></th>
                    <th>Hotel</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Method</th>
                    <th>Path</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="errorlog__table-body">
            </tbody>
        </table>

        <button class="btn btn-danger mt-3">Delete Selected</button>
    </div>

    <!-- Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-wiventory">
                    <h5 class="modal-title">Update Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
		  <form id="update__error-status">
                    <select class="form-select">
                        <option value="treated">Treated</option>
                        <option value="untreated">Untreated</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary">Update</button>
                </div>
		  </form>
            </div>
        </div>
    </div>

    <!-- Error Trace Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-wiventory">
                    <h5 class="modal-title">Error Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
		  <pre id="error__text" class="text-danger"><!-- Error loaded dynamically. --></pre>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showStatusModal() {
            new bootstrap.Modal(document.getElementById('statusModal')).show();
        }

        function showErrorModal() {
            new bootstrap.Modal(document.getElementById('errorModal')).show();
        }

        document.getElementById('checkAll').addEventListener('change', function() {
            document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = this.checked);
        });
    </script>
</body>
</html>
