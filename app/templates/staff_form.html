<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration | Williams Court Hotel & Suites</title>
    <script type="module" defer src="/static/js/dashboard/staff_management.js?v={{ cache_id }}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <style>
body {
  background-color: #fdfdfd;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .brand-logo {
      width: 80px;
      height: 80px;
      background-color: #ff8c00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      margin: 0 auto 1rem;
      font-size: 1.2rem;
    }
    .btn-orange {
      background-color: #ff8c00;
      border: none;
    }
    .btn-orange:hover {
      background-color: #e67e00;
    }
    .form-control:focus {
      border-color: #ff8c00;
      box-shadow: 0 0 0 0.2rem rgba(255,140,0,0.25);
    }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card p-4">
            <div class="text-center">
              <!-- Replace with real logo -->
              <img src="/static/images/public/hotel_logo.png" alt="Williams Court Hotel & Suites Logo" class="brand-logo" />
              <h4 class="mb-1 text-dark">Staff Registration</h4>
              <p class="text-muted">Please complete your registration details</p>
            </div>
            <form id="staff__reg-form">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">First Name</label>
                  <input type="text" class="form-control" name="first_name" placeholder="John" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Last Name</label>
                  <input type="text" class="form-control" placeholder="Doe" name="last_name" required>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-control" placeholder="example@email.com" name="email" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Username</label>
                  <input type="text" class="form-control" placeholder="joey" name="username" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" name="number" placeholder="+234 800 000 0000" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Portfolio</label>
                <input type="text" class="form-control" name="portfolio" placeholder="Bartender" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select" required name="gender">
                  <option value="" disabled selected>Select gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" name="dob" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Start Date</label>
                  <input name="start_date" type="date" class="form-control">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" placeholder="123 Street, City, State" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Next of Kin</label>
                <input type="text" class="form-control" name="nok" placeholder="Relative/Contact Person" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Next of Kin Number</label>
                <input type="text" class="form-control" name="nok_number" placeholder="+234 800 000 0000">
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" placeholder="********" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-orange text-white fw-bold py-2">Register</button>
              </div>
            </form>
            <p class="text-center mt-3 mb-0">
            Already registered? <a href="/app/account/login" class="text-decoration-none" style="color:#ff8c00;">Login here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
