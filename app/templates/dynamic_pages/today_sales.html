<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Daily Sales Record</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore our room services and manage reservations efficiently. From deluxe to standard rooms, ensure a pleasant stay with complementary breakfast and top-notch amenities."
      />

    <!-- Link Hotel Icon -->
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />

    <!-- Link Font-Is-Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Link Public CSS Files-->
    <link rel="stylesheet" type="text/css" href="/static/css/public/index.css?v={{ cache_id }}" />
    <link rel="stylesheet" type="text/css" href="/static/css/public/fonts.css?v={{ cache_id }}" />
    <link rel="stylesheet" type="text/css" href="/static/css/public/styles.css?v={{ cache_id }}" />
    <link rel="stylesheet" type="text/css" href="/static/css/public/components.css?v={{ cache_id }}" />

    <!-- Link Staff_dashboard CSS Files-->
    <link rel="stylesheet" type="text/css" href="/static/css/dashboard/sales_details.css?{{ cache_id }}" />

    <!-- Link Staff_dashboard JS Files-->
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>

    <script type="module" defer src="/static/js/dashboard/common.js?v={{ cache_id }}"></script>
    <script type="module" defer src="/static/js/dashboard/constant.js?v={{ cache_id }}"></script>

    <script type="module" defer src="/static/js/dashboard/inventory/today_sales.js?{{ cache_id }}"></script>
  </head>
  <body>
    <div class="sales-container">

      <div class="sales-table-column">
	<!-- This section dynamically loaded -->
	<h1 id="sales__record-title"></h1>
	<p id="sales__record-date"></p>

	<div>
	  <table class="custom-table">
	    <thead>
	      <tr>
		<th>S/N</th>
		<th>Customer Names</th>
		<th>Purchase Items</th>
		<th>Quantity</th>
		<th>Status</th>
		<th>Amount</th>
		<th>Action</th>
	      </tr>
	    </thead>
	    <tbody id="sales-table-body" class="sales-table-body">
	      <!-- Rows will be dynamically added here -->
	    </tbody>
	  </table>
	</div>
      </div>

      <!-- Modal for Guest Details -->
      <div class="modal" id="guestModal">
	<div class="modal-content">
	  <span class="modal-close" id="modalClose">&times;</span>
	  <h2>Guest Details</h2>
	  <div id="modalDetails">
	  </div>
	</div>
      </div>
    </div>


    <!-- Popup Modal For Guest details -->
    <div id="guest__popupModal" class="popup-modal">
      <div class="popup-modal-content guest__popup-modal">
	<!-- Close Button -->
	<button class="close-btn closePopupModal">&times;</button>

	<h1>Booking Details</h1>
	<div id="guest__info" class="guest__info">
	  <!-- Order info will be dynamically loaded here -->
	</div>

	<div class="room__summary">
	  <div class="room__total-cost">
	    <p>Amount</p>
	    <p id="room__totalAmount"></p>
	  </div>
	  <button id="booking__print-receipt" class="highlight-btn">Print Receipt</button>
	</div>
      </div>
    </div>

    <!-- confirm order before deleting-->
    <div id="order__confirmation-modal">
    </div>

  </body>
</html>
