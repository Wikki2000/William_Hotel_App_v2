    .thank-you-container {
      text-align: center;

      width: 100%;
    }

    .checkmark {
      font-size: 64px;
      color: #28a745;
    }

    .thank-you-text {
      font-size: 1.5rem;
      font-weight: 600;
      color: #333;
      margin-top: 20px;
    }

    .subtext {
      color: #666;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .btn-orange {
      background-color: #f57c00;
      color: white;
      border: none;
      margin-top: 30px;
    }

    .btn-orange:hover {
      background-color: #e06900;
    }
