<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Room Availability | Williams Court Hotel & Suites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />

    <style>
html, body {
  height: 100%;
  background-color: #f8f9fa;
}

    .container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      padding: 2rem;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-primary {
      background-color: #e55300;
      border-color: #e55300;
    }

    .btn-primary:hover {
      background-color: #e66e0d;
      border-color: #e66e0d;
    }

    #loader {
      display: none;
    }
    </style>
  </head>
  <body>

    <div class="container">
      <div class="card">
        <!-- Hotel Logo and Name -->
        <div class="d-flex align-items-center gap-2 mb-4">
          <img src="/static/images/public/hotel_logo.png" alt="Williams Court Hotel Logo" style="height: 50px;">
          <span class="fw-semibold text-muted fs-5">Williams Court Hotel & Suites</span>
        </div>

        <h4 class="mb-4 text-center">Check Room Availability</h4>

        <form id="availabilityForm">
          <div class="mb-3">
            <label for="roomType" class="form-label">Room Type</label>
            <select class="form-select" id="roomType">
              {% for room in rooms %}
              <option value="{{ room.name }}" {% if room.name == selected_room %}selected{% endif %}>
              {{ room.name }} - ₦{{ '{:,.0f}'.format(room.amount) }}
              </option>
              <!--<option value="Standard" selected>Standard - ₦19,500</option>
                <option value="Deluxe">Deluxe - ₦22,500</option>-->
                {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="numRooms" class="form-label">Number of Rooms</label>
            <input type="number" class="form-control" id="numRooms" value="1" min="1" required>
          </div>

          <div class="mb-3">
            <label for="checkinDate" class="form-label">Check-in Date</label>
            <input type="date" class="form-control" id="checkinDate" required>
          </div>

          <div class="mb-3">
            <label for="checkoutDate" class="form-label">Check-out Date</label>
            <input type="date" class="form-control" id="checkoutDate" required>
          </div>
          <div class="mb-3">
            <label for="totalPrice" class="form-label">Total Price</label>
            <input type="text" class="form-control" id="totalPrice" value="₦19,500" readonly>
          </div>

          <div class="d-grid">
            <button type="submit" id="check__btn" class="btn btn-primary">Check Availability</button>
          </div>

          <div class="text-center mt-3" id="loader">
            <div class="spinner-border text-warning" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Availability Modal -->
    <div class="modal fade" id="availabilityModal" tabindex="-1" aria-labelledby="availabilityModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="availabilityModalLabel">Room Availability</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p id="availabilityMessage"></p>
            <hr>
            <p class="text-muted mb-0">
            Need assistance? Contact us:
            <br>
            <strong>Email:</strong> contact@williamsnscourthotel.com<br>
            <strong>Phone:</strong> +234 916 000 0188
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const rooms = {{ rooms | tojson }};
const priceMap = {};

rooms.forEach(room => {
  priceMap[room.name] = room.amount;
});


const roomTypeSelect = document.getElementById('roomType');
const numRoomsInput = document.getElementById('numRooms');
const totalPriceInput = document.getElementById('totalPrice');
const loader = document.getElementById('loader');
const btn = document.getElementById('check__btn');

// Date inputs
const checkinInput = document.getElementById("checkinDate");
const checkoutInput = document.getElementById("checkoutDate");

function updateTotalPrice() {
  const selectedRoom = roomTypeSelect.value;
  const roomCount = parseInt(numRoomsInput.value) || 1;

  let total = 0;

  // Check if selectedRoom has a price
  if (priceMap[selectedRoom]) {
    const checkinDate = new Date(checkinInput.value);
    const checkoutDate = new Date(checkoutInput.value);

    let durationInDays = 1;

    if (checkinInput.value && checkoutInput.value) {
      const durationInMs = checkoutDate - checkinDate;
      durationInDays = Math.ceil(durationInMs / (1000 * 60 * 60 * 24));
      if (isNaN(durationInDays) || durationInDays <= 0) {
        durationInDays = 1;
      }
    }

    total = priceMap[selectedRoom] * roomCount * durationInDays;
  }

  totalPriceInput.value = `₦${total.toLocaleString()}`;
}

// Add listeners to all relevant inputs
roomTypeSelect.addEventListener('change', updateTotalPrice);
numRoomsInput.addEventListener('input', updateTotalPrice);
checkinInput.addEventListener('change', updateTotalPrice);
checkoutInput.addEventListener('change', updateTotalPrice);



document.getElementById('availabilityForm').addEventListener('submit', function(event) {
  event.preventDefault();
  loader.style.display = 'block';
  btn.style.display = 'none';
  btn.disabled = true;

  const requestedRooms = parseInt(numRoomsInput.value);
  const selectedRoomType = roomTypeSelect.value;
  const checkinDate = document.getElementById("checkinDate").value;
  const checkoutDate = document.getElementById("checkoutDate").value;
  const roomCount = document.getElementById("numRooms").value;

  const requestData = {
    checkin: checkinDate,
    checkout: checkoutDate,
    count: roomCount
  };


  
  function validateDates() {
        const checkinInput = document.getElementById("checkinDate");
        const checkoutInput = document.getElementById("checkoutDate");

        const checkinDate = new Date(checkinInput.value);
        const checkoutDate = new Date(checkoutInput.value);
        const today = new Date();

        // Set the time to 00:00:00 for accurate comparison
        today.setHours(0, 0, 0, 0);

        if (checkinInput.value && checkinDate < today) {
                  alert("Check-in date cannot be in the past.");
                  checkinInput.value = "";
                  return;
              }

        if (checkinInput.value && checkoutInput.value && checkinDate > checkoutDate) {
                  alert("Check-out date must be after check-in date.");
                  checkoutInput.value = "";
              }
  }


  // Validate on date selection (change event)
  document.getElementById("checkinDate").addEventListener("change", validateDates);
  document.getElementById("checkoutDate").addEventListener("change", validateDates);


  const url = `/api/v1/rooms/${selectedRoomType}/check-availability`;

  fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(requestData)
  })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      document.getElementById("loader").style.display = "none";
      btn.style.display = 'block';

      setTimeout(() => {
        loader.style.display = 'none';

        const availableRooms = data.available_rooms;
        if (requestedRooms > availableRooms) {
          const message = `Only ${availableRooms} ${selectedRoomType} room(s) are available for the selected dates.`;
          document.getElementById('availabilityMessage').innerText = message;
          const modal = new bootstrap.Modal(document.getElementById('availabilityModal'));
          modal.show();
        } else {
	  const amount = totalPriceInput.value.replaceAll(",", "").replaceAll("₦", "");
	  const roomType = roomTypeSelect.value.toLowerCase();
	  const checkin = checkinInput.value;
	  const checkout = checkoutInput.value;
	  const roomRate = priceMap[roomType];
	  const bookData = { requestedRooms, roomRate, amount, roomType, checkin, checkout };
	  sessionStorage.setItem("bookData", JSON.stringify(bookData));
	  sessionStorage.setItem("roomType", roomType);
	  if (confirm("Great news! Your selected dates are available. Click OK to continue with your booking.")) {
	    window.location.href = "/guest/rooms/confirm-booking";
	  }
        }
      }, 1000);

    })
    .catch(error => {
      console.error("Fetch error:", error);
      document.getElementById("loader").style.display = "none";
      btn.style.display = 'block';
    })
    .finally(() => {
      btn.disabled = false;
    });

});
    </script>

  </body>
</html>
