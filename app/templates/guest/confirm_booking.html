<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Guest Booking | Williams Court Hotel & Suites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script type="module" defer src="/static/js/guest/online_booking.js?v={{ cache_id }}"></script>

  <style>
    body {
      background-color: #f8f9fa;
      padding: 15px;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      width: 100%;
      padding: 1.5rem;
    }
    .btn-primary {
      background-color: #e55300;
      border-color: #e55300;
    }
    .btn-primary:hover {
      background-color: #e66e0d;
      border-color: #e66e0d;
    }
    .form-label {
      font-weight: 500;
    }
    img.hotel-logo {
      height: 50px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <!-- Logo and Title -->
        <div class="d-flex align-items-center gap-2 mb-4">
          <img src="/static/images/public/hotel_logo.png" class="hotel-logo" alt="Hotel Logo">
          <span class="fw-semibold text-muted fs-5">Williams Court Hotel & Suites</span>
        </div>
        <h4 class="text-center mb-4">Guest Booking Details</h4>

        <!-- Read-only Booking Info -->
        <div class="mb-3">
          <label class="form-label">Room Type</label>
          <input type="text" class="form-control" id="roomType" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">Number of Rooms</label>
          <input type="text" class="form-control" id="roomCount" readonly>
        </div>

        <div class="mb-3">
          <label for="checkinDate" class="form-label">Check-in Date </label>
          <input type="date" class="form-control" id="checkinDate" required readonly>
        </div>

        <div class="mb-3">
          <label for="checkoutDate" class="form-label">Check-out Date </label>
          <input type="date" class="form-control" id="checkoutDate" required readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">Total Price</label>
          <input type="text" class="form-control" id="amount" readonly>
        </div>

        <!-- Guest Info Form -->
        <form id="bookingForm">
          <div class="mb-3">
            <label class="form-label">Name </label>
            <input type="text" name="name" class="form-control" placeholder="e.g., James John" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone No. </label>
            <input type="tel" name="phone" class="form-control" placeholder="e.g., 08187643578" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Address </label>
            <input type="text" name="address" class="form-control" placeholder="e.g., No. Ado Rd, Ikere-Ekiti" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Gender </label>
            <select class="form-select" name="gender" required>
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Guest No. </label>
            <input type="text" name="guest_number" class="form-control" placeholder="e.g., 1 male, 1 female" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" placeholder="e.g., john@gmail.com" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Proceed to Book</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Summary Modal -->
<div class="modal fade" id="summaryModal" tabindex="-1" aria-labelledby="summaryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Booking Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p><strong>Room Type:</strong> <span id="room"></span></p>
        <p><strong>Number of Rooms:</strong> <span id="numRooms"></span></p>
	<p><strong>Check-in Date:</strong> <span id="checkin"></span></p>
	<p><strong>Check-out Date:</strong> <span id="checkout"></span></p>
        <p><strong>Total Price:</strong> ₦<span id="totalAmount"></span></p>
        <p><strong>Guest:</strong> <span id="guestName"></span></p>
        <p><strong>Phone:</strong> <span id="guestPhone"></span></p>
        <p><strong>Email:</strong> <span id="guestEmail"></span></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Edit</button>
        <button type="button" class="btn btn-primary" id="confirm__booking-btn">Confirm Booking</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
