<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Processing Payment | Wiventory - Smart Business Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />

  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script type="module" defer src="/static/js/guest/proccess_transaction.js?v={{ cache_id }}"></script>
  <style>
    body {
      background-color: #fff7f0;
      color: #333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-container {
      text-align: center;
      padding: 20px;
    }

    .spinner-border {
      width: 4rem;
      height: 4rem;
      color: #f57c00;
    }

    .processing-text {
      font-size: 1.25rem;
      margin-top: 20px;
      color: #f57c00;
      font-weight: 600;
    }

    .subtext {
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Processing...</span>
    </div>
    <div class="processing-text">Your transaction is processing...</div>
    <div class="subtext">Please wait, do not close this page.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
