<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>{{ title }} – Guest Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/guest_dashboard/service_category.css') }}?v={{ cache_id }}">

    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type="module" defer src="/static/js/guest/service_category.js?v={{ cache_id }}"></script>
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />

  </head>
  <body>

    <div class="container py-3">
      <!-- Hotel Header -->
      <div class="hotel-header">
        <img src="/static/images/public/hotel_logo.png" alt="Hotel Logo" id="hotelLogo">
        <span class="hotel-name" id="hotelName">Williams Court Hotel & Suites</span>
      </div>

      <!-- Page Title -->
      <h1 class="page-title">{{ icon }} {{ title }}</h1>

      <!-- Search Bar -->
      <div class="search-bar my-3">
        <input type="text" class="form-control" placeholder="Search menu..." id="searchInput" onkeyup="filterMenu()">
      </div>

      <!-- Menu List -->
      <div id="menuList">
        {% for item in items %}
        {% if item.get('qty_stock', 1) > 0 %}
        <div class="menu-card">
          <div class="menu-name">{{ item.name.upper() }}</div>
          <div class="menu-price">₦{{ "{:,.0f}".format(item.amount or 0) }}</div>
        </div>
        {% endif %}
        {% endfor %}
      </div>
    </div>
    <script>
      function filterMenu() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const menuItems = document.querySelectorAll('.menu-card');
        menuItems.forEach(card => {
          const name = card.querySelector('.menu-name').textContent.toLowerCase();
          card.style.display = name.includes(filter) ? '' : 'none';
        });
      }
    </script>
  </body>
</html>
